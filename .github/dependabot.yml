version: 2
updates:
  - package-ecosystem: gomod
    directory: /services/backend
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /services/frontend
    schedule:
      interval: weekly
    groups:
      npm-deps:
        patterns: ["*"]
    ignore:
      # TypeScript 7 has no working consumer yet: typescript-eslint 8.67.0 (the
      # current release) peer-requires `typescript >=4.8.4 <6.1.0`, so a 7.x bump
      # produces an unresolvable tree — `npm ci` fails with ERESOLVE. This repo's
      # CI cannot catch that (every job is gated on an unshipped go.sum), which
      # makes the ignore load-bearing rather than a convenience. Drop it once
      # typescript-eslint widens the range; 6.x minor/patch still come through.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /services/backend/.docker
      - /services/frontend/.docker
    schedule:
      interval: weekly
    groups:
      docker-images:
        patterns: ["*"]
