name: Bug report
# feat:if template
description: Something in the template is broken or behaves wrong.
# feat:else
#~ description: Something is broken or behaves wrong.
# feat:end
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected, what actually happened.
# feat:if backend
      placeholder: |
        Ran `make run-local`, expected backend on :8000, got "connection refused".
# feat:end
# feat:if frontend,!backend
#~       placeholder: |
#~         Ran `make run-local`, expected the app on :5173, got a blank page.
# feat:end
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal steps from a fresh clone.
      placeholder: |
        1. git clone …
        2. ./bootstrap.sh -n myapp -m github.com/me/myapp/backend -a "Me"
        3. make run-local
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Output from `make logs`, the failing command, or CI job.
      render: shell
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Docker version, Go version, Node version.
      placeholder: "Ubuntu 24.04, Docker 27.3, Go 1.26.1, Node 22.9"
    validations:
      required: true
  - type: input
    id: commit
    attributes:
# feat:if template
      label: Template commit / version
# feat:else
#~       label: Commit / version
# feat:end
      placeholder: "git rev-parse HEAD"
