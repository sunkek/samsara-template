name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
# feat:if backend
  # Skip CI while the repo is still the unbootstrapped template. Presence of
  # services/backend/go.sum is the signal: the template ships without it; the
  # adopter runs `go mod tidy` after bootstrap and commits the resulting sum.
  # Until then there is nothing meaningful to build, so the real jobs are gated
  # on this check. A build without `backend` has no go.sum to wait for, so the
  # gate reports bootstrapped unconditionally there.
# feat:end
  gate:
    runs-on: ubuntu-latest
    outputs:
      bootstrapped: ${{ steps.check.outputs.bootstrapped }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
# feat:if backend
        run: |
          if [ -f services/backend/go.sum ]; then
            echo "bootstrapped=true" >> "$GITHUB_OUTPUT"
          else
            echo "Template not bootstrapped (no go.sum); skipping CI."
            echo "bootstrapped=false" >> "$GITHUB_OUTPUT"
          fi
# feat:else
#~         run: echo "bootstrapped=true" >> "$GITHUB_OUTPUT"
# feat:end

  # feat:if backend
  backend:
    needs: gate
    if: needs.gate.outputs.bootstrapped == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/backend/go.mod
          cache-dependency-path: services/backend/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: services/backend
      - name: build
        run: go build ./cmd/main
      - name: test
        run: go test ./...
      # The Swagger spec is committed (Dockerfile.prod copies it into the image),
      # so it can go stale the moment a handler annotation changes. Pin swag to
      # the version the Makefile documents; a different one reformats the spec
      # and the diff becomes noise.
      - name: swagger docs are current
        working-directory: .
        run: |
          go install github.com/swaggo/swag/v2/cmd/swag@v2.0.0
          make check-api-docs
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # feat:end

  # feat:if frontend
  frontend:
    needs: gate
    if: needs.gate.outputs.bootstrapped == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      - name: install
        run: npm ci
      - name: lint
        run: npm run lint
      - name: test
        run: npm test
      - name: build
        run: npm run build
  # feat:end

  # feat:if template
  # Unit tests for the feature renderer itself. Cheap, so it gates the (much
  # slower) matrix job below.
  feature-renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/features_test.sh

  # Template-maintenance job: proves every feature combination still renders and
  # builds. The `template` feature is never selected by apply_features.sh, so
  # this job exists only in the template and disappears from every fork.
  #
  # The matrix is EXHAUSTIVE — all 2^5 combinations — deliberately. A curated
  # subset leaves the untested ones to break silently, and a fork only finds out
  # after it has been created. Generate the list with:
  #   python3 -c 'from itertools import combinations as c; f="backend frontend postgresql redis rabbitmq".split(); print("\n".join(sorted(",".join(x) for r in range(6) for x in c(f,r))))'
  feature-matrix:
    needs: feature-renderer
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - "backend"
          - "frontend"
          - "postgresql"
          - "redis"
          - "rabbitmq"
          - "backend,frontend"
          - "backend,postgresql"
          - "backend,redis"
          - "backend,rabbitmq"
          - "frontend,postgresql"
          - "frontend,redis"
          - "frontend,rabbitmq"
          - "postgresql,redis"
          - "postgresql,rabbitmq"
          - "redis,rabbitmq"
          - "backend,frontend,postgresql"
          - "backend,frontend,redis"
          - "backend,frontend,rabbitmq"
          - "backend,postgresql,redis"
          - "backend,postgresql,rabbitmq"
          - "backend,redis,rabbitmq"
          - "frontend,postgresql,redis"
          - "frontend,postgresql,rabbitmq"
          - "frontend,redis,rabbitmq"
          - "postgresql,redis,rabbitmq"
          - "backend,frontend,postgresql,redis"
          - "backend,frontend,postgresql,rabbitmq"
          - "backend,frontend,redis,rabbitmq"
          - "backend,postgresql,redis,rabbitmq"
          - "frontend,postgresql,redis,rabbitmq"
          - "backend,frontend,postgresql,redis,rabbitmq"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/backend/go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - name: render
        run: |
          mkdir -p /tmp/render
          cp -R . /tmp/render/app
          rm -rf /tmp/render/app/.git
          ./scripts/apply_features.sh -f "${{ matrix.features }}" -C /tmp/render/app
      - name: no markers left
        run: |
          # bootstrap.sh drops the feature tooling from a fork; do the same here
          # so the marker syntax in its own source does not count as a leftover.
          rm -f /tmp/render/app/scripts/apply_features.sh /tmp/render/app/scripts/features.awk \
                /tmp/render/app/scripts/features_test.sh
          # Match the renderer's own rule: markers are recognised only at the
          # start of a line. Prose that mentions `feat:if` mid-sentence (the
          # marker docs, ADR 0001) is not a leftover marker and must not fail.
          if grep -rnE "^[[:space:]]*(//|#|--|<!--|;)?[[:space:]]*feat:(if|else|end)" \
               /tmp/render/app --exclude-dir=.git; then
            echo "unrendered feature markers survived"; exit 1
          fi
          # The `~` leader must never survive either: it means a block that
          # should have been uncommented was left inert.
          if grep -rnE "^[[:space:]]*(//~|#~|<!--~|--~|;~)([[:space:]]|$)" \
               /tmp/render/app --exclude-dir=.git --exclude=FEATURES.md; then
            echo "inert ~-leader lines survived"; exit 1
          fi
      - name: backend builds
        run: |
          [ -d /tmp/render/app/services/backend ] || exit 0
          cd /tmp/render/app/services/backend
          go mod tidy
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go build ./cmd/main
          go test ./...
      - name: frontend builds
        run: |
          [ -d /tmp/render/app/services/frontend ] || exit 0
          cd /tmp/render/app/services/frontend
          npm install --no-audit --no-fund
          npm run build
      - name: CI definitions are valid
        run: |
          cd /tmp/render/app
          python3 - <<'EOF'
          import glob, sys, yaml
          for f in sorted(glob.glob(".github/workflows/*.yml")) + glob.glob(".gitlab-ci.yml"):
              doc = yaml.safe_load(open(f))
              if f.startswith(".github") and not doc.get("jobs"):
                  sys.exit(f"{f}: rendered workflow has no jobs")
              if f == ".gitlab-ci.yml" and not [k for k in doc
                                                if not k.startswith(".") and k != "stages"]:
                  sys.exit(f"{f}: rendered pipeline has no jobs")
              print("ok", f)
          EOF
      - name: compose config is valid
        run: |
          docker network create dev || true
          cd /tmp/render/app
          make gen-env APP=matrix_app GEN_ENVS="dev local stage prod"
          for env in dev stage prod; do
            ENVIRONMENT=$env docker compose \
              -f infra/docker-compose.yml -f infra/docker-compose.$env.yml \
              --profile app config >/dev/null
          done
  # feat:end
