# Stage override: same shape as prod (built images, nginx-served frontend), but
# driven by env/stage/*. Diverge from prod here as your staging needs grow
# (resource limits, replicas, different published port, etc.). Merged on
# docker-compose.yml.
# An override with no services at all is not a valid compose file; the
# empty mapping keeps `make up` working on an infra-only scaffold.
# feat:if backend|frontend
services:
# feat:else
#~ services: {}
# feat:end
  # feat:if backend
  backend:
    build:
      context: ../services/backend
      dockerfile: .docker/Dockerfile.prod
    environment:
      # Same topology as prod: requests arrive through the frontend's nginx, so
      # without proxy trust the per-IP rate limiter sees only nginx.
      MY_PROJECT_API_FIBER_TRUST_PROXY: "true"
      MY_PROJECT_API_FIBER_TRUSTED_PROXIES: "172.16.0.0/12"
    healthcheck:
      test: ["CMD", "/health"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  # feat:end

  # feat:if frontend
  frontend:
    build:
      context: ../services/frontend
      dockerfile: .docker/Dockerfile.prod
    ports:
      - "${MY_PROJECT_FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
  # feat:end
