# GitLab CI mirror of .github/workflows/ci.yml. Keep the two in sync.
# feat:if backend
#
# Both jobs short-circuit while the repo is still the unbootstrapped template.
# Presence of services/backend/go.sum is the signal: the template ships without
# it; the adopter runs `go mod tidy` after bootstrap and commits the resulting
# sum. Until then the guard exits 0 so pipelines stay green. A build without
# `backend` has no go.sum to wait for, so the guard renders as a no-op there.
# feat:end

stages:
  - test

# feat:if backend
.template-guard: &template-guard
  - |
    if [ ! -f services/backend/go.sum ]; then
      echo "Template not bootstrapped (no go.sum); skipping CI."
      exit 0
    fi
# feat:else
#~ .template-guard: &template-guard
#~   - 'true'
# feat:end

# feat:if backend
backend:
  stage: test
  # Pinned by hand: GitLab has no equivalent of setup-go's go-version-file, so
  # this must be bumped alongside the `go` directive in services/backend/go.mod.
  image: golang:1.26.4
  cache:
    key:
      files:
        - services/backend/go.sum
    paths:
      - .go-cache/
  variables:
    GOPATH: $CI_PROJECT_DIR/.go-cache
  script:
    - *template-guard
    - cd services/backend
    - |
      unformatted="$(gofmt -l .)"
      if [ -n "$unformatted" ]; then
        echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
      fi
    - go vet ./...
    - go build ./cmd/main
    - go test ./...
    # Mirrors the "swagger docs are current" step in .github/workflows/ci.yml.
    # The spec is committed (Dockerfile.prod copies it into the image), so a
    # changed handler annotation must be regenerated and committed with it.
    - cd "$CI_PROJECT_DIR"
    - go install github.com/swaggo/swag/v2/cmd/swag@v2.0.0
    # GOPATH is redirected into the cache dir above, so its bin/ is not on PATH.
    - PATH="$GOPATH/bin:$PATH" make check-api-docs
    - cd services/backend
    # Mirrors the govulncheck step in .github/workflows/ci.yml.
    - go install golang.org/x/vuln/cmd/govulncheck@latest
    - govulncheck ./...

backend-lint:
  stage: test
  image: golangci/golangci-lint:v2.1
  script:
    - *template-guard
    - cd services/backend
    - golangci-lint run

# feat:end

# feat:if backend,postgresql
# Mirrors the `integration` job in .github/workflows/ci.yml: the only run that
# executes the hand-written SQL (docs/adr/0005). A GitLab service container
# rather than docker-in-docker, so no privileged runner is needed; the migration
# chain is applied with the golang-migrate CLI because `docker run` is not
# available inside a plain service-container job.
integration:
  stage: test
  image: golang:1.26.4
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app
    POSTGRES_DB: app
    GOPATH: $CI_PROJECT_DIR/.go-cache
    INTEGRATION_DATABASE_URL: postgres://app:app@postgres:5432/app?sslmode=disable
  cache:
    key:
      files:
        - services/backend/go.sum
    paths:
      - .go-cache/
  script:
    - *template-guard
    # Keep this version in step with the migrate/migrate image tag used by the
    # GitHub job and by `make migrate-up`.
    - go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.0
    - $GOPATH/bin/migrate -path infra/postgresql/migration -database "$INTEGRATION_DATABASE_URL" up
    - cd services/backend
    - go test -tags=integration ./internal/integration/...
# feat:end

# feat:if frontend
frontend:
  stage: test
  image: node:26
  script:
    - *template-guard
    - cd services/frontend
    # `npm ci` (not `npm install`): package-lock.json is committed, and ci fails
    # on lockfile drift instead of silently resolving past it. Keep this in step
    # with the same install in .github/workflows/ci.yml.
    - npm ci
    - npm run lint
    - npm test
    - npm run build
# feat:end

# Secrets hygiene. Mirrors the `secrets` job in .github/workflows/ci.yml. Needs
# no age key and cannot decrypt anything: both questions are answerable from the
# ciphertext and the index alone.
secrets:
  stage: test
  image: alpine:3.22
  script:
    - apk add --no-cache make git bash
    - make secrets-check
    - |
      # Split so that a failing git fails the job instead of reading as clean.
      files="$(git ls-files 'env/*')" || exit 1
      tracked="$(printf '%s\n' "$files" | grep -Ev '^env/(example|sops)/' || true)"
      if [ -n "$tracked" ]; then
        echo "These plaintext env files are tracked by git:" >&2
        echo "$tracked" >&2
        echo "Move them under env/<env>/ (git-ignored) and commit the ciphertext" >&2
        echo "from env/sops/ instead. If any of them ever reached a remote," >&2
        echo "rotate the values -- deleting the file does not remove it from history." >&2
        exit 1
      fi

# Mirrors the `shell` job in .github/workflows/ci.yml. Severity `warning`:
# info-level notes are style opinions, and a lint that fires on taste gets
# ignored rather than fixed.
shell:
  stage: test
  image: koalaman/shellcheck-alpine:stable
  script:
    - shellcheck -x -S warning bootstrap.sh scripts/*.sh
